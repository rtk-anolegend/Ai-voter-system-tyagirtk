<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Internal Server Error</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-container {
            text-align: center;
            max-width: 600px;
            background: rgba(26, 26, 46, 0.8);
            padding: 60px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: #f44336;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(244, 67, 54, 0.3);
        }
        .error-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .error-message {
            color: #a0a0b0;
            font-size: 16px;
            margin-bottom: 40px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #0D8F81;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background: #0a6b60;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(13, 143, 129, 0.3);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">500</div>
        <h1 class="error-title">Internal Server Error</h1>
        <p class="error-message">Something went wrong on our end. Please try again later or contact support.</p>
        <a href="/" class="btn"><i class="fas fa-home"></i> Back to Home</a>
    </div>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
