<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>{% block title %}Voter Management System{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta name="theme-color" content="#1a1a2e">
</head>
<body>
    <div class="app-container">
        <!-- Mobile Menu Toggle -->
        <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <i class="fas fa-bars"></i>
        </button>
        
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-vote-yea"></i>
                    <h2>Voter<span>IQ</span></h2>
                </div>
                <div class="system-badge">
                    <span class="status-dot online"></span>
                    Live System
                </div>
            </div>
            
            <div class="sidebar-search">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="mobileSearch" placeholder="Quick search..." autocomplete="off">
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="{{ url_for('search') }}" class="nav-item {% if request.endpoint == 'search' %}active{% endif %}">
                    <i class="fas fa-search"></i>
                    <span>Smart Search</span>
                </a>
                <a href="#" id="exportBtn" class="nav-item">
                    <i class="fas fa-download"></i>
                    <span>Export Data</span>
                </a>
                <a href="#" id="importBtn" class="nav-item">
                    <i class="fas fa-upload"></i>
                    <span>Import Data</span>
                </a>
                <a href="{{ url_for('logout') }}" class="nav-item">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="system-info">
                    <i class="fas fa-microchip"></i>
                    <span>Raspberry Pi System</span>
                </div>
                <div class="local-ip">
                    <i class="fas fa-network-wired"></i>
                    <span id="localIp">Local Network</span>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1>{% block header_title %}Dashboard{% endblock %}</h1>
                    <div class="breadcrumb">
                        <a href="#">Home</a>
                        <span>/</span>
                        <span>{% block breadcrumb %}Overview{% endblock %}</span>
                    </div>
                </div>
                
                <div class="header-right">
                    <div class="header-search">
                        <div class="search-wrapper">
                            <i class="fas fa-search"></i>
                            <input type="text" id="globalSearch" placeholder="Search voters..." autocomplete="off">
                            <div id="searchSuggestions" class="search-suggestions"></div>
                        </div>
                    </div>
                    
                    <div class="profile-section">
                        <div class="notifications">
                            <i class="fas fa-bell"></i>
                            <span class="badge">3</span>
                        </div>
                        <div class="profile-dropdown">
                            <img src="https://ui-avatars.com/api/?background=0D8F81&color=fff&name=Admin" alt="Profile">
                            <span>Admin</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                    </div>
                </div>
            </header>
            
            <div class="content-wrapper">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    <!-- Modals -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Voter Profile</h2>
                <span class="close">&times;</span>
            </div>
            <div id="profileContent" class="modal-body"></div>
        </div>
    </div>
    
    <div id="uploadModal" class="modal">
        <div class="modal-content small">
            <div class="modal-header">
                <h2>Upload Document</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="uploadForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label>Document Type</label>
                        <select name="doc_type" required>
                            <option value="aadhaar">Aadhaar Card</option>
                            <option value="pan">PAN Card</option>
                            <option value="ration">Ration Card</option>
                            <option value="pension">Pension Form</option>
                            <option value="land">Land Papers</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Select File</label>
                        <input type="file" name="document" accept=".pdf,.jpg,.jpeg,.png" required>
                    </div>
                    <button type="submit" class="btn-primary">Upload</button>
                </form>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/search.js') }}"></script>
    <script>
        // Get local IP address
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('localIp').innerHTML = `<i class="fas fa-network-wired"></i> ${data.ip}`;
            })
            .catch(() => {
                document.getElementById('localIp').innerHTML = '<i class="fas fa-network-wired"></i> Local Server';
            });
    </script>
</body>
</html>
