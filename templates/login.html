<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Village Intelligence Portal Login
    </title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{

            --primary:#14b8a6;
            --primary-dark:#0f766e;

            --bg-dark:#020617;

            --bg-card:
                rgba(15,23,42,0.78);

            --text:#ffffff;

            --text-secondary:#94a3b8;

            --border:
                rgba(255,255,255,0.08);
        }

        html,
        body{

            width:100%;

            overflow-x:hidden;
        }

        body{

            font-family:'Inter',sans-serif;

            min-height:100vh;

            display:flex;

            align-items:center;

            justify-content:center;

            padding:20px;

            position:relative;

            overflow:hidden;

            background:
                linear-gradient(
                    135deg,
                    #020617 0%,
                    #0f172a 45%,
                    #134e4a 100%
                );
        }

        /* Background Glow */

        body::before{

            content:'';

            position:absolute;

            width:500px;
            height:500px;

            top:-150px;
            right:-150px;

            border-radius:50%;

            background:
                rgba(20,184,166,0.15);

            filter:blur(120px);

            animation:
                floating 8s ease-in-out infinite;
        }

        body::after{

            content:'';

            position:absolute;

            width:450px;
            height:450px;

            bottom:-150px;
            left:-150px;

            border-radius:50%;

            background:
                rgba(59,130,246,0.12);

            filter:blur(120px);

            animation:
                floating 10s ease-in-out infinite;
        }

        @keyframes floating{

            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(20px);
            }

            100%{
                transform:translateY(0px);
            }
        }

        .login-container{

            width:100%;

            max-width:460px;

            margin:auto;

            position:relative;

            z-index:10;
        }

        .login-card{

            width:100%;

            background:var(--bg-card);

            backdrop-filter:blur(18px);

            border:
                1px solid var(--border);

            border-radius:30px;

            padding:40px;

            box-shadow:
                0 25px 80px rgba(0,0,0,0.45);

            animation:
                slideUp 0.6s ease;
        }

        @keyframes slideUp{

            from{
                opacity:0;
                transform:translateY(30px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .logo{

            text-align:center;

            margin-bottom:30px;
        }

        .logo-image{

            width:95px;

            height:95px;

            object-fit:cover;

            border-radius:50%;

            display:block;

            margin:
                0 auto 18px auto;

            border:
                4px solid rgba(255,255,255,0.08);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.35);
        }

        .logo-icon{

            font-size:75px;

            color:var(--primary);

            margin-bottom:15px;
        }

        .logo h1{

            color:var(--text);

            font-size:30px;

            font-weight:700;

            line-height:1.3;
        }

        .logo span{
            color:var(--primary);
        }

        .village-subtitle{

            color:var(--text-secondary);

            margin-top:8px;

            font-size:14px;

            letter-spacing:1px;
        }

        .system-tag{

            text-align:center;

            color:var(--text-secondary);

            font-size:13px;

            margin-bottom:30px;
        }

        .form-group{
            margin-bottom:22px;
        }

        .form-group label{

            display:block;

            margin-bottom:10px;

            color:#e2e8f0;

            font-weight:500;

            font-size:14px;
        }

        .input-group{
            position:relative;
        }

        .input-group i{

            position:absolute;

            left:16px;

            top:50%;

            transform:translateY(-50%);

            color:#94a3b8;
        }

        .input-group input{

            width:100%;

            padding:
                14px 16px 14px 48px;

            border-radius:14px;

            border:
                1px solid rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.04);

            color:white;

            font-size:15px;

            transition:0.3s;
        }

        .input-group input::placeholder{
            color:#94a3b8;
        }

        .input-group input:focus{

            outline:none;

            border-color:var(--primary);

            box-shadow:
                0 0 0 4px rgba(20,184,166,0.12);
        }

        .login-btn{

            width:100%;

            padding:14px;

            border:none;

            border-radius:14px;

            cursor:pointer;

            font-size:16px;

            font-weight:600;

            color:white;

            transition:0.3s;

            background:
                linear-gradient(
                    135deg,
                    #14b8a6,
                    #0f766e
                );
        }

        .login-btn:hover{

            transform:translateY(-2px);

            box-shadow:
                0 12px 25px rgba(20,184,166,0.25);
        }

        .error-message{

            background:
                rgba(239,68,68,0.12);

            border:
                1px solid rgba(239,68,68,0.2);

            color:#fecaca;

            padding:12px;

            border-radius:12px;

            margin-bottom:22px;

            text-align:center;

            font-size:14px;
        }

        .info-text{

            text-align:center;

            margin-top:22px;

            color:var(--text-secondary);

            font-size:12px;

            line-height:1.7;
        }

        .developer-credit{

            margin-top:15px;

            text-align:center;

            font-size:12px;

            color:#64748b;
        }

        .developer-credit span{
            color:var(--primary);
        }

        /* Mobile Responsive */

        @media (max-width:768px){

            body{
                padding:14px;
            }

            .login-container{
                max-width:100%;
            }

            .login-card{

                padding:28px 18px;

                border-radius:22px;
            }

            .logo h1{

                font-size:22px;

                line-height:1.2;
            }

            .logo-image{

                width:80px;
                height:80px;
            }

            .village-subtitle{
                font-size:13px;
            }

            .system-tag{
                font-size:12px;
            }

            .input-group input{

                font-size:14px;

                padding:
                    13px 14px 13px 44px;
            }

            .login-btn{

                padding:13px;

                font-size:15px;
            }
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">

                <!-- Upload logo.png in static/images -->

                <img
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    alt="Village Logo"
                    class="logo-image"
                >

                <h1>

                    BABURA
                    <span>RAGHUNATH</span>
                    SINGH

                </h1>

                <div class="village-subtitle">

                    Village Intelligence Portal

                </div>

            </div>

            <div class="system-tag">

                <i class="fas fa-microchip"></i>

                Raspberry Pi Local Intelligence System

            </div>

            <!--
            Uncomment for Flask Server

            {% if error %}

            <div class="error-message">

                <i class="fas fa-exclamation-triangle"></i>

                {{ error }}

            </div>

            {% endif %}
            -->

            <form method="POST">

                <div class="form-group">

                    <label>

                        Username

                    </label>

                    <div class="input-group">

                        <i class="fas fa-user"></i>

                        <input
                            type="text"
                            name="username"
                            required
                            placeholder="Enter username"
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label>

                        Password

                    </label>

                    <div class="input-group">

                        <i class="fas fa-lock"></i>

                        <input
                            type="password"
                            name="password"
                            required
                            placeholder="Enter password"
                        >

                    </div>

                </div>

                <button
                    type="submit"
                    class="login-btn"
                >

                    <i class="fas fa-sign-in-alt"></i>

                    Secure Login

                </button>

            </form>

            <div class="info-text">

                <i class="fas fa-shield-alt"></i>

                Secure Local Access Only

                <br>

                AI-Powered Rural Intelligence Network

            </div>

            <div class="developer-credit">

                Developed By
                <span>RTK</span>

            </div>

        </div>

    </div>

</body>

</html>
